services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: ha-etcd
    restart: unless-stopped
    network_mode: host
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=${ETCD_NAME:?set ETCD_NAME}
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://${CONTROL_IP}:2379,http://127.0.0.1:2379
      - --advertise-client-urls=http://${CONTROL_IP}:2379
      - --listen-peer-urls=http://${CONTROL_IP}:2380
      - --initial-advertise-peer-urls=http://${CONTROL_IP}:2380
      - --initial-cluster=${ETCD_INITIAL_CLUSTER:?set ETCD_INITIAL_CLUSTER}
      - --initial-cluster-state=new
      - --initial-cluster-token=mysql-ha-control-plane-v1
    volumes:
      - ./etcd-data:/var/lib/etcd
