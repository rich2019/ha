services:
  mysql:
    image: mysql:8.0.39
    container_name: ha-mysql
    restart: unless-stopped
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${HA_MYSQL_ROOT_PASSWORD:?set HA_MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      HA_REPLICATION_PASSWORD: ${HA_REPLICATION_PASSWORD:?set HA_REPLICATION_PASSWORD}
      HA_ROLE: ${HA_ROLE:-replica}
    command:
      - --bind-address=${NODE_IP:?set NODE_IP}
      - --server-id=${MYSQL_SERVER_ID:?set MYSQL_SERVER_ID}
      - --log-bin=mysql-bin
      - --relay-log=mysql-relay
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./primary-init.sh:/docker-entrypoint-initdb.d/01-ha-init.sh:ro
