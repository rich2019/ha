services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.15
    command: >-
      /usr/local/bin/etcd --name etcd-1 --data-dir /etcd-data
      --advertise-client-urls http://etcd-1:2379 --listen-client-urls http://0.0.0.0:2379
      --initial-advertise-peer-urls http://etcd-1:2380 --listen-peer-urls http://0.0.0.0:2380
      --initial-cluster etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      --initial-cluster-state new --initial-cluster-token ha-dev
    networks: [ha]
  etcd-2:
    image: quay.io/coreos/etcd:v3.5.15
    command: >-
      /usr/local/bin/etcd --name etcd-2 --data-dir /etcd-data
      --advertise-client-urls http://etcd-2:2379 --listen-client-urls http://0.0.0.0:2379
      --initial-advertise-peer-urls http://etcd-2:2380 --listen-peer-urls http://0.0.0.0:2380
      --initial-cluster etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      --initial-cluster-state new --initial-cluster-token ha-dev
    networks: [ha]
  etcd-3:
    image: quay.io/coreos/etcd:v3.5.15
    command: >-
      /usr/local/bin/etcd --name etcd-3 --data-dir /etcd-data
      --advertise-client-urls http://etcd-3:2379 --listen-client-urls http://0.0.0.0:2379
      --initial-advertise-peer-urls http://etcd-3:2380 --listen-peer-urls http://0.0.0.0:2380
      --initial-cluster etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      --initial-cluster-state new --initial-cluster-token ha-dev
    networks: [ha]
  mysql-1:
    image: mysql:8.0.39
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql1:/var/lib/mysql
      - ./deploy/mysql/primary.cnf:/etc/mysql/conf.d/ha.cnf:ro
      - ./deploy/mysql/primary-init.sql:/docker-entrypoint-initdb.d/01-primary.sql:ro
    networks: [ha]
  mysql-2:
    image: mysql:8.0.39
    command: ["--server-id=2", "--log-bin=mysql-bin", "--relay-log=mysql-relay", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql2:/var/lib/mysql
      - ./deploy/mysql/replica.cnf:/etc/mysql/conf.d/ha.cnf:ro
    networks: [ha]
  mysql-3:
    image: mysql:8.0.39
    command: ["--server-id=3", "--log-bin=mysql-bin", "--relay-log=mysql-relay", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql3:/var/lib/mysql
      - ./deploy/mysql/replica.cnf:/etc/mysql/conf.d/ha.cnf:ro
    networks: [ha]
  replication-init:
    image: mysql:8.0.39
    depends_on:
      mysql-1: {condition: service_healthy}
      mysql-2: {condition: service_healthy}
      mysql-3: {condition: service_healthy}
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./deploy/mysql/init-replication.sh:/init-replication.sh:ro
    entrypoint: ["/bin/bash", "/init-replication.sh"]
    networks: [ha]
  mysql-agent-1:
    build:
      context: .
      args: {APP: mysql-agent}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      mysql-1: {condition: service_healthy}
      etcd-1: {condition: service_started}
      etcd-2: {condition: service_started}
      etcd-3: {condition: service_started}
    environment:
      HA_AGENT_HTTP_ADDR: :9443
      HA_NODE_ID: mysql-1
      HA_NODE_ADDRESS: mysql-1:3306
      HA_MYSQL_DSN: ha_agent:replpass@tcp(mysql-1:3306)/?parseTime=true
      HA_REPLICATION_USER: repl
      HA_REPLICATION_PASSWORD: replpass
      HA_ETCD_ENDPOINTS: http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379
      HA_CLUSTER_NAME: mysql-ha-dev
      HA_AGENT_CA_FILE: /etc/ha/pki/ca.crt
      HA_AGENT_CERT_FILE: /etc/ha/pki/agent-mysql-agent-1.crt
      HA_AGENT_KEY_FILE: /etc/ha/pki/agent-mysql-agent-1.key
    volumes: [./work/dev-pki:/etc/ha/pki:ro]
    networks: [ha]
  mysql-agent-2:
    build:
      context: .
      args: {APP: mysql-agent}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      mysql-2: {condition: service_healthy}
      etcd-1: {condition: service_started}
      etcd-2: {condition: service_started}
      etcd-3: {condition: service_started}
    environment:
      HA_AGENT_HTTP_ADDR: :9443
      HA_NODE_ID: mysql-2
      HA_NODE_ADDRESS: mysql-2:3306
      HA_MYSQL_DSN: ha_agent:replpass@tcp(mysql-2:3306)/?parseTime=true
      HA_REPLICATION_USER: repl
      HA_REPLICATION_PASSWORD: replpass
      HA_ETCD_ENDPOINTS: http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379
      HA_CLUSTER_NAME: mysql-ha-dev
      HA_AGENT_CA_FILE: /etc/ha/pki/ca.crt
      HA_AGENT_CERT_FILE: /etc/ha/pki/agent-mysql-agent-2.crt
      HA_AGENT_KEY_FILE: /etc/ha/pki/agent-mysql-agent-2.key
    volumes: [./work/dev-pki:/etc/ha/pki:ro]
    networks: [ha]
  mysql-agent-3:
    build:
      context: .
      args: {APP: mysql-agent}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      mysql-3: {condition: service_healthy}
      etcd-1: {condition: service_started}
      etcd-2: {condition: service_started}
      etcd-3: {condition: service_started}
    environment:
      HA_AGENT_HTTP_ADDR: :9443
      HA_NODE_ID: mysql-3
      HA_NODE_ADDRESS: mysql-3:3306
      HA_MYSQL_DSN: ha_agent:replpass@tcp(mysql-3:3306)/?parseTime=true
      HA_REPLICATION_USER: repl
      HA_REPLICATION_PASSWORD: replpass
      HA_ETCD_ENDPOINTS: http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379
      HA_CLUSTER_NAME: mysql-ha-dev
      HA_AGENT_CA_FILE: /etc/ha/pki/ca.crt
      HA_AGENT_CERT_FILE: /etc/ha/pki/agent-mysql-agent-3.crt
      HA_AGENT_KEY_FILE: /etc/ha/pki/agent-mysql-agent-3.key
    volumes: [./work/dev-pki:/etc/ha/pki:ro]
    networks: [ha]
  alert-receiver:
    build:
      context: .
      args: {APP: alert-receiver}
    command: ["-listen=0.0.0.0:9099"]
    restart: unless-stopped
    networks: [ha]
  controller:
    build:
      context: .
      args: {APP: controller}
    user: "0:0"
    restart: unless-stopped
    depends_on:
      mysql-agent-1: {condition: service_started}
      mysql-agent-2: {condition: service_started}
      mysql-agent-3: {condition: service_started}
      alert-receiver: {condition: service_started}
    environment:
      HA_HTTP_ADDR: :8080
      HA_CLUSTER_NAME: mysql-ha-dev
      HA_ETCD_ENDPOINTS: http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379
      HA_EXECUTE_ACTIONS: "true"
      HA_AUTO_FAILOVER_EXECUTE: "false"
      HA_REQUIRE_ETCD: "true"
      HA_AGENTS_FILE: /etc/ha/agents.json
      HA_AGENT_CA_FILE: /etc/ha/pki/ca.crt
      HA_AGENT_CERT_FILE: /etc/ha/pki/controller-1.crt
      HA_AGENT_KEY_FILE: /etc/ha/pki/controller-1.key
      HA_ALERT_WEBHOOK_URL: http://alert-receiver:9099/webhook
    volumes:
      - ./deploy/dev/agents.json:/etc/ha/agents.json:ro
      - ./work/dev-pki:/etc/ha/pki:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [ha]

volumes:
  mysql1:
  mysql2:
  mysql3:

networks:
  ha:
